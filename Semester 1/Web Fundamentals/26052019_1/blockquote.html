<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title> Blockquote Example</title>
</head>
<body>

    <h1>  The power of the web</h1>

    <p> According to Tim Berners-Lee, the inventor of the world wide web, the web is a powerful tool for communication and information sharing.
    </p>

    <br> 
    <blockquote> The power of the web is in its universality. Access by everyone regardless of disability is an essential aspect. </blockquote>
    
</body>
</html>
