<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Contact Form - Task 3</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      display: flex;
      justify-content: center;
      padding-top: 40px;
    }

    form {
      background: #ffffff;
      padding: 30px 40px;
      border: 1px solid #cccccc;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
      width: 450px;
    }

    .form-group {
      display: flex;
      align-items: flex-start;
      margin-bottom: 18px;
    }

    label {
      width: 90px;
      text-align: right;
      padding-right: 15px;
      font-size: 14px;
      color: #333333;
      margin-top: 6px;
    }

    input[type="text"],
    input[type="email"],
    textarea {
      flex: 1;
      padding: 8px 10px;
      border: 1px solid #999999;
      border-radius: 2px;
      font-size: 14px;
      font-family: inherit;
      box-sizing: border-box;
    }

    textarea {
      height: 120px;
      resize: vertical;
    }

    input:focus,
    textarea:focus {
      outline: none;
      border-color: #4a90e2;
      box-shadow: 0 0 4px rgba(74, 144, 226, 0.4);
    }

    .button-group {
      display: flex;
      justify-content: flex-start;
      margin-left: 105px;
    }

    button[type="submit"] {
      background-color: #e1e1e1;
      color: #000000;
      border: 1px solid #767676;
      padding: 6px 16px;
      font-size: 13px;
      border-radius: 2px;
      cursor: pointer;
    }

    button[type="submit"]:hover {
      background-color: #d4d4d4;
    }
  </style>
</head>
<body>

  <form action="/my-handling-form-page" method="post">
    <div class="form-group">
      <label for="name">Name:</label>
      <input type="text" id="name" name="user_name" required />
    </div>

    <div class="form-group">
      <label for="mail">E-mail:</label>
      <input type="email" id="mail" name="user_mail" required />
    </div>

    <div class="form-group">
      <label for="msg">Message:</label>
      <textarea id="msg" name="user_message" rows="5" cols="33" required></textarea>
    </div>

    <div class="button-group">
      <button type="submit">Send your message</button>
    </div>
  </form>

</body>
</html>
