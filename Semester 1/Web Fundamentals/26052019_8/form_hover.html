<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Task 3 - Form Tooltip</title>
    <style>
        .tooltip-container {
            position: relative;
            display: inline-block;
            margin-bottom: 15px;
        }
        .tooltip-text {
            visibility: hidden;
            width: 180px;
            background-color: #333;
            color: #fff;
            text-align: center;
            border-radius: 4px;
            padding: 5px;
            position: absolute;
            z-index: 1;
            top: -5px;
            left: 105%;
            opacity: 0;
            transition: opacity 0.3s;
            font-size: 12px;
        }
        .tooltip-container:hover .tooltip-text {
            visibility: visible;
            opacity: 1;
        }
    </style>
</head>
<body>
    <h2>Form with CSS Tooltip</h2>
    <form>
        <div class="tooltip-container">
            <label for="username">Username:</label>
            <input type="text" id="username">
            <span class="tooltip-text">Enter your unique username</span>
        </div>
        <br>
        <div class="tooltip-container">
            <label for="useremail">Email:</label>
            <input type="email" id="useremail">
            <span class="tooltip-text">Enter your primary email</span>
        </div>
    </form>
</body>
</html>
