<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Task 3 - Form Pop-up</title>
</head>
<body>
    <h2>Form with Hover Pop-up</h2>
    <form>
        <div>
            <label for="name">Name:</label>
            <input type="text" id="name" onmouseover="alert('Please enter your full name');">
        </div>
        <br>
        <div>
            <label for="email">Email:</label>
            <input type="email" id="email" onmouseover="alert('Please enter a valid email address');">
        </div>
    </form>
</body>
</html>
