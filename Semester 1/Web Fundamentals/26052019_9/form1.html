<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Form 1 - Create Account</title>
  <link rel="stylesheet" href="form1.css">
</head>
<body>

  <div class="form-container">
    <div class="form-header">
      <h2>Create Account</h2>
    </div>

    <form class="account-form">
      <!-- First Name & Last Name -->
      <div class="form-group">
        <label for="fname">First name *</label>
        <input type="text" id="fname" placeholder="enter your first name" required>
      </div>
      <div class="form-group">
        <label for="lname">Last name</label>
        <input type="text" id="lname" placeholder="enter your last name">
      </div>

      <!-- Email (Full Width) -->
      <div class="form-group full-width">
        <label for="email">Email*</label>
        <input type="email" id="email" placeholder="enter your email" required>
      </div>

      <!-- Password & Confirm Password -->
      <div class="form-group">
        <label for="password">Password *</label>
        <input type="password" id="password" placeholder="enter your password" required>
      </div>
      <div class="form-group">
        <label for="cpassword">Confirm Password *</label>
        <input type="password" id="cpassword" placeholder="enter your password again" required>
      </div>

      <!-- Gender & Hobbies -->
      <div class="form-group">
        <label>Gender:</label>
        <div class="inline-options">
          <label><input type="radio" name="gender" value="male"> Male</label>
          <label><input type="radio" name="gender" value="female"> Female</label>
        </div>
      </div>
      <div class="form-group">
        <label>Hobbies</label>
        <div class="inline-options">
          <label><input type="checkbox" value="music"> Music</label>
          <label><input type="checkbox" value="sports"> Sports</label>
          <label><input type="checkbox" value="travel"> Travel</label>
          <label><input type="checkbox" value="movies"> Movies</label>
        </div>
      </div>

      <!-- Source of Income & Income Range -->
      <div class="form-group">
        <label for="income-source">Source of Income</label>
        <select id="income-source">
          <option value="employed">Employed</option>
          <option value="self-employed">Self-Employed</option>
          <option value="unemployed">Unemployed</option>
        </select>
      </div>
      <div class="form-group">
        <label for="income-range">Income</label>
        <div class="slider-container">
          <input type="range" id="income-range" min="0" max="100" value="20">
          <span class="badge">20K</span>
        </div>
      </div>

      <!-- Profile Picture Upload & Age -->
      <div class="form-group">
        <label for="profile-pic">Upload Profile Picture</label>
        <input type="file" id="profile-pic">
      </div>
      <div class="form-group">
        <label for="age">Age</label>
        <input type="number" id="age" value="18">
      </div>

      <!-- Bio (Full Width) -->
      <div class="form-group full-width">
        <label for="bio">Bio</label>
        <textarea id="bio" rows="4"></textarea>
      </div>

      <!-- Footer / Submit Button -->
      <div class="form-footer full-width">
        <button type="submit" class="submit-btn">Create</button>
      </div>
    </form>
  </div>

</body>
</html>
